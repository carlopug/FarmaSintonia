# Vhost Apache per FarmaSintonia — modello ricalcato sugli altri vhost già
# attivi sulla stessa VPS (stesso schema): DocumentRoot sotto
# /var/www/html/, nessuna direttiva PHP-FPM per-vhost
# (il collegamento a php8.3-fpm è già configurato globalmente sul server).
#
# Installazione (VPS), PRIMA di richiedere il certificato:
#   sudo cp deploy/apache-farmasintonia.conf /etc/apache2/sites-available/farmasintonia.conf
#   sudo a2ensite farmasintonia.conf
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Dopo il certbot (vedi in fondo a questo file), certbot riscrive questo
# file aggiungendo il blocco <VirtualHost *:443> e il redirect HTTP -> HTTPS.

<VirtualHost *:80>
    ServerName farmasintonia.carlopug.it

    DocumentRoot /var/www/html/farmasintonia/public

    <Directory /var/www/html/farmasintonia/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/farmasintonia-error.log
    CustomLog ${APACHE_LOG_DIR}/farmasintonia-access.log combined
</VirtualHost>

# Dopo "sudo certbot --apache -d farmasintonia.carlopug.it", certbot
# riscrive questo file nella stessa forma già in uso
# per gli altri vhost in produzione: il blocco :80 sopra diventa un semplice redirect
# permanente a https, e viene aggiunto un blocco <VirtualHost *:443> con lo
# stesso DocumentRoot/Directory, SSLEngine on e i percorsi al certificato
# in /etc/letsencrypt/live/farmasintonia.carlopug.it/. Non serve scriverlo
# a mano: lo fa certbot in automatico.
